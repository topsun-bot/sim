services:
  replay:
    build:
      context: .
      dockerfile: docker/Dockerfile.mujoco
    image: ${IMAGE_MUJOCO:-sim-replay:mujoco}
    env_file:
      - docker/.env
    volumes:
      - ${REPLAY_DATA_DIR:-./data}:/data:ro
      - ${REPLAY_OUTPUT_DIR:-./output}:/output
    environment:
      MUJOCO_GL: ${MUJOCO_GL:-egl}
      REPLAY_BACKEND: mujoco
    command: >
      run
      --mcap /data/eda9cc2192f7.mcap
      --meta /data/eda9cc2192f7.meta.json
      --backend mujoco
      --output /output

  replay-viz:
    profiles: [viz]
    build:
      context: .
      dockerfile: docker/Dockerfile.mujoco
    image: ${IMAGE_MUJOCO:-sim-replay:mujoco}
    network_mode: host
    env_file:
      - docker/.env
    volumes:
      - ${REPLAY_DATA_DIR:-./data}:/data:ro
      - ${REPLAY_OUTPUT_DIR:-./output}:/output
      - /tmp/.X11-unix:/tmp/.X11-unix
    environment:
      DISPLAY: ${DISPLAY:-:0}
      MUJOCO_GL: egl
      REPLAY_BACKEND: mujoco
    command: >
      run
      --mcap /data/eda9cc2192f7.mcap
      --meta /data/eda9cc2192f7.meta.json
      --backend mujoco
      --output /output
      --visualize
      --no-video

  replay-foxglove:
    profiles: [foxglove]
    build:
      context: .
      dockerfile: docker/Dockerfile.mujoco
    image: ${IMAGE_MUJOCO:-sim-replay:mujoco}
    env_file:
      - docker/.env
    ports:
      - "${FOXGLOVE_PORT:-8765}:${FOXGLOVE_PORT:-8765}"
    volumes:
      - ${REPLAY_DATA_DIR:-./data}:/data:ro
      - ${REPLAY_OUTPUT_DIR:-./output}:/output
    environment:
      MUJOCO_GL: ${MUJOCO_GL:-egl}
      REPLAY_BACKEND: mujoco
    command: >
      run
      --mcap /data/eda9cc2192f7.mcap
      --meta /data/eda9cc2192f7.meta.json
      --backend mujoco
      --output /output
      --foxglove
      --foxglove-host 0.0.0.0
      --foxglove-port 8765
      --no-video

  replay-isaac:
    profiles: [isaac]
    build:
      context: .
      dockerfile: docker/Dockerfile.isaac
      args:
        ISAAC_BASE_IMAGE: ${ISAAC_SIM_IMAGE:-python:3.11-slim}
    image: ${IMAGE_ISAAC:-sim-replay:isaac}
    runtime: nvidia
    user: "0:0"
    env_file:
      - docker/.env
    volumes:
      - ${REPLAY_DATA_DIR:-./data}:/data:ro
      - ${REPLAY_OUTPUT_DIR:-./output}:/output
      # ISAAC_SIM_PATH 由 setup.sh 写入 docker-compose.override.yml 挂载
    environment:
      REPLAY_BACKEND: isaac
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility,graphics}
      ACCEPT_EULA: ${ACCEPT_EULA:-Y}
      PRIVACY_CONSENT: ${PRIVACY_CONSENT:-Y}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
      run
      --mcap /data/eda9cc2192f7.mcap
      --meta /data/eda9cc2192f7.meta.json
      --backend isaac
      --output /output
      --no-video
